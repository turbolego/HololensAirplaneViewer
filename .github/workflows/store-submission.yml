# Builds a Store-signed .appxupload and submits it to the Microsoft Store.
#
# Prerequisites (set up once):
#   1. Register as a Windows developer in Partner Center
#   2. Create/associate an Azure AD tenant with Partner Center
#   3. Register a Microsoft Entra application and assign "Manager" role
#   4. Add these secrets to the repo:
#      - AZURE_AD_TENANT_ID       (from Entra > Overview > Tenant ID)
#      - AZURE_AD_CLIENT_ID       (from App registrations > your app)
#      - AZURE_AD_CLIENT_SECRET   (from App > Certificates & secrets)
#      - SELLER_ID                (from Partner Center > Account settings > Identifiers)
#      - PRODUCT_ID (optional)    (Partner Center > your app > Product identity >
#                                  'Product ID' GUID; if unset the workflow
#                                  discovers it via 'msstore apps list')
#   5. The app must already exist in Partner Center with at least one
#      submission (even a draft with the correct package info).
#
# NOTE: Each 'submit' run auto-increments <Identity Version> in
# Package.appxmanifest (4th segment stays 0, as the Store requires), commits
# the bump back to the repo after a successful submission, and creates a
# GitHub release tagged v<version> with the sideloadable .appx attached.
#
# See: https://learn.microsoft.com/windows/apps/publish/msstore-dev-cli/github-actions
#
# WARNING: App update operations currently support free products only.
# Paid products will be supported in a future MSStore CLI release.

name: Store Submission

on:
  # Manual trigger: choose 'package-only' to just build, or 'submit' to go all the way
  workflow_dispatch:
    inputs:
      action:
        description: 'Store action'
        required: true
        default: 'submit'
        type: choice
        options:
          - package-only   # Build + validate, upload artifact only
          - submit         # Build + validate + publish to Store + create GitHub release

jobs:
  store-package:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: NuGet restore
        run: nuget restore HololensAirplaneViewer.sln

      # ── Install UWP build tools ──────────────────────────────────────
      - name: Install Windows 10 SDK 19041 and UWP MSBuild tools
        shell: powershell
        run: |
          $vswhere   = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath    = & $vswhere -latest -products * -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $installer modify `
            --installPath "$vsPath" `
            --add Microsoft.VisualStudio.Component.Windows10SDK.19041 `
            --add Microsoft.VisualStudio.ComponentGroup.UWP.MSBuild `
            --quiet --norestart --force
          if ($LASTEXITCODE -notin @(0, 3010)) { exit $LASTEXITCODE }

      # ── Generate a temporary cert for building ───────────────────────
      # The Store-signed package will be re-signed by Partner Center;
      # we just need something to get past MSBuild's signing requirement.
      - name: Create build signing certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=BB1A7F2A-A87C-44C8-8C14-84C6486E7E75" `
            -KeyUsage DigitalSignature `
            -FriendlyName "HololensAirplaneViewer" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "ci" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert `
            -FilePath "${{ github.workspace }}\HololensAirplaneViewer_TemporaryKey.pfx" `
            -Password $pwd

      # ── Auto-increment package version (submit runs only) ───────────
      # Microsoft Store requires the 4th segment (revision) to be 0.
      # The bump is applied to the working tree BEFORE the build so the
      # package carries the new version; it is committed back to the repo
      # after a successful Store submission (see 'Commit version bump').
      - name: Auto-increment package version
        if: github.event.inputs.action == 'submit'
        shell: pwsh
        run: |
          $manifestPath = "${{ github.workspace }}\Package.appxmanifest"
          $manifest = [xml](Get-Content $manifestPath)
          $current = [Version]$manifest.Package.Identity.Version
          $next = "{0}.{1}.{2}.0" -f $current.Major, $current.Minor, ($current.Build + 1)
          $manifest.Package.Identity.Version = $next
          $manifest.Save($manifestPath)
          "NEXT_VERSION=$next" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Bumped package version: $($current.ToString()) -> $next"

      # ── Build Release .appxupload (Store-compatible) ──────────────
      # UapAppxPackageBuildMode=StoreUpload + /t:Publish produces a
      # proper .appxupload that the Store accepts — unlike the pre-compiled
      # .NET Native packages from GenerateAppxPackageOnBuild.
      - name: Build and package Release x86
        run: >
          msbuild HololensAirplaneViewer.csproj
          /t:Publish
          /p:Configuration=Release
          /p:Platform=x86
          /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=StoreUpload
          /p:AppxPackageDir=AppPackages\
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile=${{ github.workspace }}\HololensAirplaneViewer_TemporaryKey.pfx
          /p:PackageCertificatePassword=ci
          /p:PackageCertificateThumbprint=""

      - name: Remove build certificate
        if: always()
        run: Remove-Item -Path "${{ github.workspace }}\HololensAirplaneViewer_TemporaryKey.pfx" -ErrorAction SilentlyContinue

      # ── Run Windows App Certification Kit ────────────────────────────
      # NOTE: WACK will fail on non-HoloLens runners (exit code -5) because
      # the Windows.Holographic-only app cannot launch on the desktop CI VM.
      # This is expected and does not block Store submission — Microsoft
      # re-runs their own certification in a proper HoloLens environment.
      # We treat -5 as acceptable (not $LASTEXITCODE is PS 5.1 compatible).
      - name: Run Windows App Certification Kit
        shell: powershell
        run: |
          $package = Get-ChildItem -Path "${{ github.workspace }}\AppPackages" `
            -Recurse -Filter "*.appxupload" | Select-Object -First 1
          if (-not $package) { throw "No .appxupload found in AppPackages/" }
          Write-Host "Testing: $($package.FullName)"
          & "C:\Program Files (x86)\Windows Kits\10\App Certification Kit\appcert.exe" `
            test -AppType Universal `
            -AppxPackagePath "$($package.FullName)" `
            -ReportOutputPath "${{ github.workspace }}\WackReport.xml"
          Write-Host "WACK exit code: $LASTEXITCODE"
          # Exit code -5 = app could not be launched (expected on non-HoloLens runners)
          if ($LASTEXITCODE -eq -5) {
            Write-Host "WACK exit code -5 is expected on non-HoloLens runners -- ignoring"
            exit 0
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload WACK report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WACK-Report
          path: |
            WackReport.xml
            WackDigest.xml
          if-no-files-found: ignore

      # ── Upload app package as artifact ───────────────────────────────
      - name: Upload appxupload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HololensAirplaneViewer-${{ github.sha }}-Store-x86
          path: |
            AppPackages/**/*.appxupload
            AppPackages/**/*.appx
            AppPackages/**/*.appxsym
            AppPackages/**/Dependencies/**
            AppPackages/**/Install.ps1
            AppPackages/**/Add-AppDevPackage.ps1
          if-no-files-found: warn

      # ── Store submission (only on explicit 'submit') ────────────────
      - name: Configure Microsoft Store CLI
        if: github.event.inputs.action == 'submit'
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Reconfigure store credentials
        if: github.event.inputs.action == 'submit'
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId "$env:TENANT_ID" `
            --sellerId "$env:SELLER_ID" `
            --clientId "$env:CLIENT_ID" `
            --clientSecret "$env:CLIENT_SECRET"

      - name: Publish app package to Microsoft Store
        if: github.event.inputs.action == 'submit'
        shell: pwsh
        env:
          PRODUCT_ID: ${{ secrets.PRODUCT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'

          # The msstore CLI needs the Partner Center PRODUCT ID (a GUID), NOT
          # the manifest identity name (e.g. 'Turbolego.HololensAirplaneViewer').
          # Resolve it via 'msstore apps list', which prints a table with
          # columns: ProductId | Display Name | PackageId. Match the Display
          # Name column (from the manifest, short, never wraps) and take the
          # ProductId. The PackageId column is NOT used for matching because
          # the CLI truncates/wraps long package identity names across lines.
          # Optional: set a PRODUCT_ID repo secret to skip discovery.
          $manifest = [xml](Get-Content "${{ github.workspace }}\Package.appxmanifest")
          $identityName = $manifest.Package.Identity.Name
          $displayName = $manifest.Package.Properties.DisplayName
          Write-Host "Manifest identity name: $identityName"
          Write-Host "Manifest display name:  $displayName"

          $productId = $env:PRODUCT_ID
          if ([string]::IsNullOrWhiteSpace($productId)) {
            Write-Host "No PRODUCT_ID secret -- discovering via 'msstore apps list'..."
            # Strip ANSI escapes and Spectre.Console markup (e.g. [bold u]...[/])
            $clean = (msstore apps list 2>&1 | Out-String) `
              -replace "`e\[[0-9;]*m", "" `
              -replace '\[/?[a-zA-Z0-9 ]+\]', ""
            foreach ($line in ($clean -split "`r?`n")) {
              $cells = $line -split '│' | ForEach-Object { $_.Trim() }
              if ($cells -contains $displayName) { $productId = $cells[2]; break }
            }
            if ([string]::IsNullOrWhiteSpace($productId)) {
              throw "Could not resolve the Store product ID for '$displayName'. " +
                    "Run 'msstore apps list' locally to find it, then set a PRODUCT_ID repo secret."
            }
          }
          Write-Host "Store product ID: $productId"

          # Publish the already-built package(s) in AppPackages/. Point msstore
          # at the PROJECT DIRECTORY (it locates Package.appxmanifest and the
          # newest *.appxupload under AppPackages/) -- passing a bare
          # .appxupload FILE fails with 'could not find a project publisher'.
          msstore publish "${{ github.workspace }}" -id $productId

      # ── Persist the version bump (only after a successful submit) ────
      # Commit Package.appxmanifest back to main so the repo always matches
      # the last Store-submitted version and the next run increments above it.
      - name: Commit version bump
        if: github.event.inputs.action == 'submit'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.appxmanifest
          git commit -m "chore: bump version to $env:NEXT_VERSION for Store submission [skip ci]" -q
          git push origin HEAD:${{ github.ref_name }}
          Write-Host "Committed and pushed Package.appxmanifest (v$env:NEXT_VERSION)"

      # ── Create GitHub release (only after a successful submit) ───────
      # Attach a sideloadable .appx artifact for GitHub releases.
      # .appxupload remains used for Microsoft Store submission only.
      - name: Create GitHub release
        if: github.event.inputs.action == 'submit'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:NEXT_VERSION"
          $pkg = Get-ChildItem -Path "${{ github.workspace }}\AppPackages" `
            -Recurse -Filter "*.appx" |
            Where-Object { $_.FullName -notmatch '[\\/]Dependencies[\\/]' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $pkg) { throw "No sideloadable .appx found in AppPackages/." }
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$($pkg.Name)"
          $releaseNotes = @(
            "Store submission of version $env:NEXT_VERSION.",
            "",
            "Direct sideload download: [$($pkg.Name)]($downloadUrl)"
          ) -join "`n"
          Write-Host "Creating release $tag with package: $($pkg.Name)"
          $bumpSha = git rev-parse HEAD
          gh release create $tag `
            --title "HololensAirplaneViewer $tag" `
            --notes $releaseNotes `
            --target $bumpSha `
            "$($pkg.FullName)"
          Write-Host "Release $tag created: https://github.com/turbolego/HololensAirplaneViewer/releases/tag/$tag"
